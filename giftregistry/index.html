<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wedding Gift Registry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background-color:#383838;
  color: white;
  font-family: 'Baskerville Display PT', serif;
  margin: 0;
}
.wrapper {
  width: 80%;
  margin: 5vh auto;
  display: flex;
  flex-direction: column;
  gap: 2vh;
}
.card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  color: #333;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  transition: transform 0.3s ease;
}
.card:hover {
  transform: translateY(-5px);
}
.card img {
  width: 25%;
  height: auto;
  object-fit: contain;
  border-radius: 10px;
}
.card-content {
  flex: 1;
  padding-left: 20px;
}
.card-content span {
  display: block;
  font-size: 1.2em;
  color: #113c25;
  font-weight: bold;
}
.card-content p {
  margin: 5px 0;
}
button {
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  background-color: #113c25;
  color: white;
  cursor: pointer;
  font-size: 1em;
  transition: background 0.3s;
}
button:disabled {
  background-color: #777;
  cursor: not-allowed;
}
</style>
</head>

<body>
  <div class="wrapper" id="giftList"></div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbxrK6JYiINhVI7eXxG_KHhe986lAmiAL2jSZ5waPN59PtuKixqQ8U60-VB_lgdHFTMH2Q/exec';

async function fetchGifts() {
  try {
    const res = await fetch(scriptURL);
    const items = await res.json();
    renderGifts(items);
  } catch (err) {
    console.error('Fetch error:', err);
  }
}

function renderGifts(items) {
  const container = document.getElementById('giftList');

  // Only rebuild missing or updated cards
  const existing = {};
  [...container.children].forEach(c => existing[c.dataset.name] = c);

  items.forEach(item => {
    let card = existing[item.name];
    if (!card) {
      card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = item.name;
      card.innerHTML = `
        <img src="${item.image || 'giftimgs/default.png'}" alt="${item.name}">
        <div class="card-content">
          <span>${item.name}</span>
          <p>Quantity: <strong>${item.quantity}</strong></p>
          <p>Price Range: <strong>${item.price}</strong></p>
          <p>Status: <strong>${item.status}</strong></p>
          <a href="${item.link}" target="_blank">View Item</a>
        </div>
        <button ${item.status === 'Reserved' ? 'disabled' : ''}>
          ${item.status === 'Reserved' ? 'Reserved' : 'Reserve this item'}
        </button>`;
      container.appendChild(card);

      // Button click → reserve
      const btn = card.querySelector('button');
      btn.addEventListener('click', () => reserveItem(item.name, btn));
    } else {
      // Update existing card values live
      card.querySelector('p strong').textContent = item.quantity;
      const ps = card.querySelectorAll('p strong');
      ps[0].textContent = item.quantity;
      ps[1].textContent = item.price;
      ps[2].textContent = item.status;
      const btn = card.querySelector('button');
      btn.disabled = item.status === 'Reserved';
      btn.textContent = item.status === 'Reserved' ? 'Reserved' : 'Reserve this item';
    }
  });
}

async function reserveItem(itemName, btn) {
  btn.disabled = true;
  btn.textContent = 'Reserving...';
  try {
    await fetch(scriptURL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ itemName })
    });
    await fetchGifts(); // refresh live
  } catch (err) {
    console.error('Reservation error:', err);
    btn.textContent = 'Error!';
  }
}

// Auto-refresh every 10s (cards stay visible)
fetchGifts();
setInterval(fetchGifts, 10000);
</script>
</body>
</html>
